version: "3.8"

services:
 mysql:
  image: mysql:latest
  container_name: mysql_db
  environment:
   MYSQL_ROOT_PASSWORD: debottam
   MYSQL_DATABASE: mydb
  ports:
   - "8080:3306"
  volumes:
   - "mysql-data:/var/lib/mysql"
  networks:
   - mynetwork

volumes:
 mysql-data:
  external: true

networks:
 mynetwork:
  external: true
